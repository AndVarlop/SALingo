<div class="level-filter" role="group" aria-label="Filter by level">
  <button
    type="button"
    class="level-filter__chip"
    [class.level-filter__chip--active]="selected() === null"
    (click)="select(null)"
  >
    All
  </button>
  @for (level of levels(); track level) {
    <button
      type="button"
      class="level-filter__chip"
      [class.level-filter__chip--active]="selected() === level"
      [class.level-filter__chip--locked]="lockedLevels().has(level)"
      [title]="lockedLevels().has(level) ? label[level] + ' (locked)' : label[level]"
      (click)="select(level)"
    >
      @if (lockedLevels().has(level)) {
        <span aria-hidden="true">🔒</span>
      }
      {{ level }}
    </button>
  }
</div>
