<div class="level-filter" role="group" aria-label="Filter by level">
  <button
    type="button"
    class="level-filter__chip"
    [class.level-filter__chip--active]="selected() === null"
    (click)="select(null)"
  >
    All
  </button>
  @for (level of levels(); track level) {
    <button
      type="button"
      class="level-filter__chip"
      [class.level-filter__chip--active]="selected() === level"
      [title]="label[level]"
      (click)="select(level)"
    >
      {{ level }}
    </button>
  }
</div>
