<nav class="sidebar" [class.sidebar--collapsed]="collapsed()" aria-label="Main navigation">
  <div class="sidebar__brand">
    <app-logo [variant]="collapsed() ? 'icon' : 'full'" />
    <button
      type="button"
      class="sidebar__toggle"
      (click)="toggleCollapsed()"
      [attr.aria-label]="collapsed() ? 'Expand navigation' : 'Collapse navigation'"
      [attr.title]="collapsed() ? 'Expand navigation' : 'Collapse navigation'"
    >
      {{ collapsed() ? '»' : '«' }}
    </button>
  </div>

  <ul class="sidebar__list">
    @for (item of navItems; track item.routerLink) {
      <li>
        <a
          class="sidebar__link"
          [routerLink]="item.routerLink"
          routerLinkActive="sidebar__link--active"
          [attr.title]="collapsed() ? item.label : null"
        >
          <span class="sidebar__icon" aria-hidden="true">{{ item.icon }}</span>
          @if (!collapsed()) {
            <span>{{ item.label }}</span>
          }
        </a>
      </li>
    }
  </ul>

  <div class="sidebar__footer" [attr.title]="collapsed() ? streak() + ' day streak' : null">
    <span aria-hidden="true">🔥</span>
    @if (!collapsed()) {
      <span>{{ streak() }} day streak</span>
    }
  </div>
</nav>
