<section class="answer-builder">
  @if (question(); as q) {
    <header class="answer-builder__header">
      <h1>🛠️ Build Your Answer</h1>
      <p class="answer-builder__question">"{{ q.question }}"</p>
      <p class="answer-builder__hint">{{ q.whatInterviewerWants }}</p>
    </header>

    <div class="card answer-builder__form">
      @for (step of q.structure; track step; let i = $index) {
        <div class="answer-builder__field">
          <label [for]="'step-' + i">{{ i + 1 }}. {{ step }}</label>
          <input
            [id]="'step-' + i"
            type="text"
            [value]="stepNotes()[i]"
            (input)="setStepNote(i, $any($event.target).value)"
            placeholder="A short note in your own words…"
          />
        </div>
      }

      <button type="button" class="btn btn--primary btn--block" (click)="generateDraft()">Generate suggested answer</button>
    </div>

    @if (draft()) {
      <div class="card answer-builder__draft">
        <span class="card__eyebrow">Your suggested answer — edit it!</span>
        <textarea rows="6" [value]="draft()" (input)="setDraft($any($event.target).value)"></textarea>
        <div class="answer-builder__draft-actions">
          <button type="button" class="btn btn--ghost" (click)="goToQuestion()">View full question</button>
          <button type="button" class="btn btn--primary" (click)="saveAnswer()">
            {{ saved() ? '✓ Saved' : 'Save this answer' }}
          </button>
        </div>
      </div>
    }
  } @else {
    <app-empty-state icon="🔍" title="Question not found" description="This interview question doesn't exist.">
      <a class="btn btn--primary" routerLink="/interview-prep/questions">Back to Questions</a>
    </app-empty-state>
  }
</section>
