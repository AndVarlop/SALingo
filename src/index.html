<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SALingo — Learn English. Get Interview Ready. Get Hired.</title>
    <meta
      name="description"
      content="SALingo helps Spanish speakers learn English and prepare for call-center and customer-service job interviews through mini-games, exams, roleplay simulations and AI-powered practice."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#6c5ce7" />
    <meta name="robots" content="index, follow" />

    <!-- Security headers achievable via <meta> — GitHub Pages serves static
         files with no way to add custom HTTP response headers, so this is
         the ceiling for CSP/Referrer-Policy on this host. frame-ancestors,
         X-Frame-Options, X-Content-Type-Options and Permissions-Policy are
         NOT settable via meta (browsers require a real HTTP header for
         those) — see SECURITY_AUDIT.md for what that means and the actual
         fix (a header-capable edge in front of GitHub Pages, or migrating
         hosts). Strict-Transport-Security is already sent automatically by
         GitHub Pages for a custom domain with "Enforce HTTPS" on — verified
         directly against the live response, not assumed. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SALingo" />
    <meta property="og:url" content="https://salingo.devandvar.com/" />
    <meta property="og:title" content="SALingo — Learn English. Get Interview Ready. Get Hired." />
    <meta
      property="og:description"
      content="Learn English and prepare for call-center job interviews through mini-games, exams, roleplay simulations and AI-powered practice."
    />
    <meta property="og:image" content="/icons/icon-512x512.png" />
    <meta name="twitter:card" content="summary" />

    <!-- GitHub Pages SPA routing fix: restores the real path a deep link was
         redirected from by public/404.html's matching script, before Angular
         Router boots. See https://github.com/rafgraph/spa-github-pages -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
